{% extends 'base.html' %}{% block title %}Add patient{% endblock %}{% block body %}<h1>Add patient</h1><form method="post" class="card-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" required></div><div class="field"><label for="date_of_birth">Date of birth (YYYY-MM-DD)</label><input id="date_of_birth" name="date_of_birth" placeholder="1950-01-31"></div>
<div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div><div class="field"><label for="area">Town or estate</label><input id="area" name="area"></div><div class="field"><label for="address">Address (stored encrypted)</label><input id="address" name="address"></div><button class="btn btn--primary">Save</button></form>{% endblock %}
