{% extends 'base.html' %}{% block title %}Schedule visit{% endblock %}{% block body %}<h1>Schedule a homecare visit</h1><form method="post" class="card-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="patient_id">Patient number</label><input id="patient_id" name="patient_id" required inputmode="numeric"></div><div class="field"><label for="visit_type">Visit type</label><select id="visit_type" name="visit_type">{% for t in types %}<option>{{ t }}</option>{% endfor %}</select></div>
<div class="field"><label for="start">Start</label><input id="start" name="start" type="datetime-local" required></div><div class="field"><label for="end">End</label><input id="end" name="end" type="datetime-local" required></div><div class="field"><label for="care_plan_id">Care plan number (optional)</label><input id="care_plan_id" name="care_plan_id" inputmode="numeric"></div>
<div class="field"><label for="area">Town or estate</label><input id="area" name="area"></div><div class="field"><label for="address">Visit address (stored encrypted)</label><input id="address" name="address"></div><button class="btn btn--primary">Schedule</button></form>{% endblock %}
